<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t"><title id="t">Illustration: common questions with clear answers</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0C1930" flood-opacity=".18"/></filter></defs><g filter="url(#sh)"><rect x="30" y="30" width="300" height="58" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/></g><circle cx="60" cy="59" r="15" fill="#EFF4FF"/><text x="60" y="65" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">?</text><text x="86" y="64" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0C1930" text-anchor="start">Do you guarantee rankings?</text><g filter="url(#sh)"><rect x="170" y="100" width="330" height="58" rx="18" fill="#0C1930" stroke="#24396A"/></g><circle cx="200" cy="129" r="15" fill="#B9F24C"/><circle cx="200" cy="129" r="15" fill="#B9F24C"/><path d="M193.25 129l4.5 4.8 8.25 -9.3" fill="none" stroke="#0C1930" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="134" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start">No. We guarantee the deliverables.</text><g filter="url(#sh)"><rect x="30" y="180" width="290" height="58" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/></g><circle cx="60" cy="209" r="15" fill="#EFF4FF"/><text x="60" y="215" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">?</text><text x="86" y="214" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0C1930" text-anchor="start">When does work start?</text><g filter="url(#sh)"><rect x="180" y="250" width="320" height="58" rx="18" fill="#0C1930" stroke="#24396A"/></g><circle cx="210" cy="279" r="15" fill="#B9F24C"/><circle cx="210" cy="279" r="15" fill="#B9F24C"/><path d="M203.25 279l4.5 4.8 8.25 -9.3" fill="none" stroke="#0C1930" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="284" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start">As soon as your details are in.</text></svg>
