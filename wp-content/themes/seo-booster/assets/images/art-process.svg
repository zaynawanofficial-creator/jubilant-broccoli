<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t"><title id="t">Illustration: four steps from choosing a package to receiving your report</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0C1930" flood-opacity=".18"/></filter></defs><path d="M78 170 C150 80, 200 260, 260 170 S380 80, 442 170" fill="none" stroke="#2B416E" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/><circle cx="78" cy="170" r="42" fill="#13254A" stroke="#2B416E" stroke-width="2"/><circle cx="78" cy="170" r="28" fill="#FFFFFF"/><text x="78" y="177" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0C1930" text-anchor="middle">1</text><text x="78" y="240" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Choose</text><text x="78" y="258" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">a package</text><circle cx="199" cy="190" r="42" fill="#13254A" stroke="#2B416E" stroke-width="2"/><circle cx="199" cy="190" r="28" fill="#2563EB"/><text x="199" y="197" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="199" y="260" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Add</text><text x="199" y="278" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">project details</text><circle cx="320" cy="170" r="42" fill="#13254A" stroke="#2B416E" stroke-width="2"/><circle cx="320" cy="170" r="28" fill="#2563EB"/><text x="320" y="177" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="320" y="240" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pay</text><text x="320" y="258" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">securely</text><circle cx="441" cy="190" r="42" fill="#13254A" stroke="#2B416E" stroke-width="2"/><circle cx="441" cy="190" r="28" fill="#B9F24C"/><text x="441" y="197" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0C1930" text-anchor="middle">4</text><text x="441" y="260" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Receive</text><text x="441" y="278" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1" text-anchor="middle">your report</text></svg>
