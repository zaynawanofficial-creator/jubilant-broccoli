<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="t"><title id="t">Illustration: an email conversation about a link building package</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0C1930" flood-opacity=".18"/></filter></defs><g filter="url(#sh)"><rect x="20" y="30" width="300" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/></g><path d="M20 48 a18 18 0 0 1 18 -18 h264 a18 18 0 0 1 18 18 L170 140 Z" fill="#EFF4FF" stroke="#E2E8F0"/><path d="M20 48 L170 145 L320 48" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round"/><text x="40" y="190" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#0C1930" text-anchor="start">hello@seobooster.uk</text><text x="40" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="500" fill="#475569" text-anchor="start">A real person replies by email</text><g filter="url(#sh)"><rect x="210" y="160" width="290" height="70" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/></g><text x="230" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C1930" text-anchor="start">Can you help with links for</text><text x="230" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C1930" text-anchor="start">my plumbing business?</text><g filter="url(#sh)"><rect x="150" y="250" width="330" height="88" rx="18" fill="#0C1930"/></g><text x="172" y="280" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start">Yes. 20 citations fits a local</text><text x="172" y="298" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start">business. Here is the scope and price.</text><rect x="172" y="308" width="80" height="20" rx="10" fill="#B9F24C"/><text x="212.0" y="322" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#0C1930" text-anchor="middle">Fixed quote</text></svg>
